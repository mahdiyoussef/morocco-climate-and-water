global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{targets: ['alertmanager:9093']}]
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: morocco_pipeline
    static_configs: [{targets: ['platform-metrics:9105']}]
  - job_name: airflow_and_spark_tasks
    static_configs: [{targets: ['statsd-exporter:9102']}]
  - job_name: postgres_serving
    static_configs: [{targets: ['postgres-exporter-serving:9187']}]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs: [{targets: ['minio:9000']}]
  - job_name: spark_master
    metrics_path: /metrics/master/prometheus
    static_configs: [{targets: ['spark-master:8080']}]
  - job_name: spark_sql
    metrics_path: /metrics/prometheus
    static_configs: [{targets: ['spark-thrift-server:4040']}]
  # Optional Linux VM/container host probes. Targets remain visible as down when disabled.
  - job_name: linux_host
    static_configs: [{targets: ['node-exporter:9100']}]
  - job_name: containers
    static_configs: [{targets: ['cadvisor:8080']}]
